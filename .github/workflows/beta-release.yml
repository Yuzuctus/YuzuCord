name: Publish YuzuCord beta release

on:
  push:
    tags:
      - "v[0-9]+-beta[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: write

concurrency:
  group: yuzucord-beta-release-assets
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out YuzuCord distribution
        uses: actions/checkout@v5
        with:
          path: distribution

      - name: Check out current official Vencord
        uses: actions/checkout@v5
        with:
          repository: Vendicated/Vencord
          path: vencord

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Enable Vencord's pinned pnpm
        working-directory: vencord
        shell: pwsh
        run: |
          corepack enable
          corepack install

      - name: Test the modular plugin catalog
        shell: pwsh
        run: ./distribution/scripts/Test-PluginCatalog.ps1

      - name: Materialize catalog plugins
        shell: pwsh
        run: >-
          ./distribution/scripts/Materialize-Plugins.ps1
          -CatalogPath ./distribution/catalog/plugins.json
          -SourceRoot ./distribution
          -VencordDirectory ./vencord

      - name: Install exact dependencies
        working-directory: vencord
        run: pnpm install --frozen-lockfile

      - name: Verify catalog plugins, lint, and types
        working-directory: vencord
        shell: pwsh
        run: |
          pnpm exec tsx --test "src/userplugins/**/*.test.ts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm eslint src/userplugins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm testTsc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build custom Vencord
        working-directory: vencord
        run: pnpm build

      - name: Build verified release bundle
        shell: pwsh
        run: |
          & distribution/scripts/Build-ReleaseBundle.ps1 `
            -DistributionDirectory distribution `
            -VencordDirectory vencord `
            -OutputDirectory release-assets `
            -Version $env:GITHUB_REF_NAME

      - name: Build self-contained installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          dotnet publish distribution/installer/RandomFavorites.Setup/RandomFavorites.Setup.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$version `
            -p:YuzuCordReleaseTag=$env:GITHUB_REF_NAME `
            -o release-assets/setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath release-assets/setup/YuzuCordSetup.exe `
            -Destination release-assets/YuzuCordSetup.exe
          $setupPath = Join-Path $PWD "release-assets/YuzuCordSetup.exe"
          $setupHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  YuzuCordSetup.exe" |
            Set-Content -LiteralPath "$setupPath.sha256" -Encoding ascii -NoNewline

      - name: Run installer safety smoke tests
        run: >-
          dotnet run
          --project distribution/installer/RandomFavorites.Setup.SmokeTests/RandomFavorites.Setup.SmokeTests.csproj
          -c Release

      - name: Publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            release-assets/YuzuCordSetup.exe `
            release-assets/YuzuCordSetup.exe.sha256 `
            release-assets/YuzuCordBundle.zip `
            release-assets/YuzuCordBundle.zip.sha256 `
            release-assets/YuzuCordBundle.manifest.json `
            --repo $env:GITHUB_REPOSITORY `
            --title "YuzuCord $env:GITHUB_REF_NAME" `
            --generate-notes `
            --prerelease `
            --verify-tag
