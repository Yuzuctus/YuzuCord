name: YuzuCord compatibility and installer tests

on:
  push:
    branches: [main, beta-v2]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vencord-compatibility:
    name: Current Vencord compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out YuzuCord distribution
        uses: actions/checkout@v5
        with:
          path: distribution

      - name: Check out current Vencord
        uses: actions/checkout@v5
        with:
          repository: Vendicated/Vencord
          path: vencord

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable Vencord's pinned pnpm
        working-directory: vencord
        run: corepack enable && corepack install

      - name: Test the modular plugin catalog
        shell: pwsh
        run: ./distribution/scripts/Test-PluginCatalog.ps1

      - name: Materialize catalog plugins
        shell: pwsh
        run: >-
          ./distribution/scripts/Materialize-Plugins.ps1
          -CatalogPath ./distribution/catalog/plugins.json
          -SourceRoot ./distribution
          -VencordDirectory ./vencord

      - name: Install exact Vencord dependencies
        working-directory: vencord
        run: pnpm install --frozen-lockfile

      - name: Run catalog plugin unit tests
        working-directory: vencord
        run: pnpm exec tsx --test "src/userplugins/**/*.test.ts"

      - name: Lint catalog plugins
        working-directory: vencord
        run: pnpm eslint src/userplugins

      - name: Type-check Vencord and catalog plugins
        working-directory: vencord
        run: pnpm testTsc

      - name: Build production Vencord
        working-directory: vencord
        run: pnpm build

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out YuzuCord distribution
        uses: actions/checkout@v5
        with:
          path: distribution

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Validate PowerShell scripts
        shell: powershell
        run: |
          $files = @(
            "distribution/scripts/PluginCatalog.psm1",
            "distribution/scripts/Materialize-Plugins.ps1",
            "distribution/scripts/Get-PluginIntegrity.ps1",
            "distribution/scripts/Test-PluginCatalog.ps1",
            "distribution/scripts/Build-ReleaseBundle.ps1",
            "distribution/scripts/RandomFavoritesManager.ps1"
          )
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$null, [ref]$errors
            ) | Out-Null
            if ($errors) { $errors | Format-List; exit 1 }
          }

      - name: Build the installer
        run: dotnet build distribution/installer/RandomFavorites.Setup/RandomFavorites.Setup.csproj -c Release

      - name: Run installer safety smoke tests
        run: dotnet run --project distribution/installer/RandomFavorites.Setup.SmokeTests/RandomFavorites.Setup.SmokeTests.csproj -c Release

      - name: Publish the self-contained EXE
        run: >-
          dotnet publish distribution/installer/RandomFavorites.Setup/RandomFavorites.Setup.csproj
          -c Release -r win-x64 --self-contained true
          -o distribution/artifacts/setup

      - name: Upload test executable
        uses: actions/upload-artifact@v5
        with:
          name: YuzuCordSetup-ci
          path: distribution/artifacts/setup/YuzuCordSetup.exe
          if-no-files-found: error
          retention-days: 7
